<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - Travelan</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; display: flex; justify-content: center; padding: 40px 16px; }
        .container { width: 100%; max-width: 460px; }
        h1 { text-align: center; margin-bottom: 32px; color: #333; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #444; font-size: 14px; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        input:focus { outline: none; border-color: #4a90d9; }
        .input-row { display: flex; gap: 8px; }
        .input-row input { flex: 1; }
        .check-btn { padding: 10px 14px; border: 1px solid #4a90d9; background: #fff; color: #4a90d9; border-radius: 6px; cursor: pointer; font-size: 13px; white-space: nowrap; }
        .check-btn:hover { background: #4a90d9; color: #fff; }
        .hint { font-size: 12px; color: #888; margin-top: 4px; }
        .msg { font-size: 12px; margin-top: 4px; }
        .msg.ok { color: #2ecc71; }
        .msg.err { color: #e74c3c; }
        .submit-btn { width: 100%; padding: 12px; background: #4a90d9; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; }
        .submit-btn:hover { background: #357abd; }
        .submit-btn:disabled { background: #b0c4de; cursor: not-allowed; }
        .result { margin-top: 24px; padding: 16px; border-radius: 6px; display: none; }
        .result.success { display: block; background: #d4edda; color: #155724; }
        .result.error { display: block; background: #f8d7da; color: #721c24; }
        .error-list { margin-top: 8px; padding-left: 20px; }
        .error-list li { margin-bottom: 4px; }
    </style>
</head>
<body>
<div class="container">
    <h1>Travelan 회원가입</h1>
    <form id="signupForm" onsubmit="return handleSubmit(event)">
        <div class="form-group">
            <label for="email">이메일</label>
            <div class="input-row">
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
                <button type="button" class="check-btn" onclick="checkAvailability('email')">중복 확인</button>
            </div>
            <div id="email-msg" class="msg"></div>
        </div>

        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" placeholder="8자 이상, 공백 불가" required minlength="8">
            <div class="hint">8자 이상, 공백 사용 불가</div>
        </div>

        <div class="form-group">
            <label for="passwordConfirm">비밀번호 확인</label>
            <input type="password" id="passwordConfirm" name="passwordConfirm" required>
            <div id="pw-match-msg" class="msg"></div>
        </div>

        <div class="form-group">
            <label for="name">이름</label>
            <input type="text" id="name" name="name" placeholder="홍길동" required>
        </div>

        <div class="form-group">
            <label for="phone">휴대폰 번호</label>
            <div class="input-row">
                <input type="tel" id="phone" name="phone" placeholder="01012345678" required pattern="^010\d{8}$">
                <button type="button" class="check-btn" onclick="checkAvailability('phone')">중복 확인</button>
            </div>
            <div class="hint">010으로 시작하는 11자리 숫자</div>
            <div id="phone-msg" class="msg"></div>
        </div>

        <div class="form-group">
            <label for="nickname">닉네임</label>
            <div class="input-row">
                <input type="text" id="nickname" name="nickname" placeholder="2~10자, 공백 불가" required minlength="2" maxlength="10">
                <button type="button" class="check-btn" onclick="checkAvailability('nickname')">중복 확인</button>
            </div>
            <div id="nickname-msg" class="msg"></div>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">가입하기</button>
    </form>

    <div id="result" class="result"></div>
</div>

<script>
    const passwordConfirm = document.getElementById('passwordConfirm');
    const password = document.getElementById('password');

    [password, passwordConfirm].forEach(el => {
        el.addEventListener('input', () => {
            const msg = document.getElementById('pw-match-msg');
            if (!passwordConfirm.value) { msg.textContent = ''; return; }
            if (password.value === passwordConfirm.value) {
                msg.textContent = '비밀번호가 일치합니다';
                msg.className = 'msg ok';
            } else {
                msg.textContent = '비밀번호가 일치하지 않습니다';
                msg.className = 'msg err';
            }
        });
    });

    async function checkAvailability(field) {
        const value = document.getElementById(field).value.trim();
        if (!value) { alert(field + ' 값을 입력해주세요'); return; }

        const msg = document.getElementById(field + '-msg');
        try {
            const res = await fetch(`/api/v1/auth/check-${field}?${field}=${encodeURIComponent(value)}`);
            const json = await res.json();
            if (res.ok && json.data.available) {
                msg.textContent = '사용 가능합니다';
                msg.className = 'msg ok';
            } else if (res.ok) {
                msg.textContent = '이미 사용 중입니다';
                msg.className = 'msg err';
            } else {
                const errors = json.error?.fieldErrors?.map(e => e.message) || [json.error?.message];
                msg.textContent = errors.join(', ');
                msg.className = 'msg err';
            }
        } catch (e) {
            msg.textContent = '확인 중 오류 발생';
            msg.className = 'msg err';
        }
    }

    async function handleSubmit(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const result = document.getElementById('result');
        btn.disabled = true;

        const body = {
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
            passwordConfirm: document.getElementById('passwordConfirm').value,
            name: document.getElementById('name').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            nickname: document.getElementById('nickname').value.trim()
        };

        try {
            const res = await fetch('/api/v1/auth/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const json = await res.json();

            if (res.status === 201) {
                result.className = 'result success';
                result.innerHTML = `<strong>가입 완료!</strong><br>ID: ${json.data.id}<br>이메일: ${json.data.email}<br>닉네임: ${json.data.nickname}`;
            } else {
                result.className = 'result error';
                const errorMsg = json.error?.message || '알 수 없는 오류';
                let html = `<strong>가입 실패:</strong> ${errorMsg}`;
                if (json.error?.fieldErrors?.length) {
                    html += '<ul class="error-list">';
                    json.error.fieldErrors.forEach(fe => {
                        html += `<li><strong>${fe.field}:</strong> ${fe.message}</li>`;
                    });
                    html += '</ul>';
                }
                result.innerHTML = html;
            }
        } catch (e) {
            result.className = 'result error';
            result.innerHTML = '<strong>네트워크 오류:</strong> 서버에 연결할 수 없습니다';
        }
        btn.disabled = false;
    }
</script>
</body>
</html>
