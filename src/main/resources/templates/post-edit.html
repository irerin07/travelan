<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 수정 - Travelan</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; display: flex; justify-content: center; padding: 40px 16px; }
        .container { width: 100%; max-width: 640px; }
        h1 { font-size: 28px; color: #333; margin-bottom: 32px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 14px; font-weight: 600; color: #333; margin-bottom: 6px; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; font-family: inherit; }
        input:focus, textarea:focus { outline: none; border-color: #4a90d9; }
        textarea { resize: vertical; min-height: 200px; }
        .buttons { display: flex; gap: 12px; margin-top: 28px; }
        .btn { display: inline-block; padding: 14px 36px; border-radius: 6px; font-size: 16px; font-weight: 600; text-decoration: none; cursor: pointer; border: none; }
        .btn-primary { background: #4a90d9; color: #fff; }
        .btn-primary:hover { background: #357abd; }
        .btn-outline { background: #fff; color: #666; border: 2px solid #ddd; }
        .btn-outline:hover { background: #f5f5f5; }
        .error { color: #e74c3c; font-size: 14px; margin-top: 12px; display: none; }
        .region-badge { display: inline-block; background: #e8f0fe; color: #4a90d9; padding: 4px 12px; border-radius: 4px; font-size: 13px; font-weight: 600; margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="container">
    <h1>게시글 수정</h1>
    <span id="region" class="region-badge"></span>

    <form id="edit-form">
        <div class="form-group">
            <label for="title">제목</label>
            <input type="text" id="title" maxlength="150" required>
        </div>

        <div class="form-group">
            <label for="content">내용</label>
            <textarea id="content" maxlength="10000" required></textarea>
        </div>

        <p id="error-msg" class="error"></p>

        <div class="buttons">
            <button type="submit" class="btn btn-primary">수정</button>
            <a id="btn-cancel" class="btn btn-outline">취소</a>
        </div>
    </form>
</div>

<script>
    const token = localStorage.getItem('accessToken');
    if (!token) {
        alert('로그인이 필요합니다.');
        location.href = '/view/login';
    }

    const pathParts = location.pathname.split('/');
    const postId = pathParts[pathParts.length - 2];

    document.getElementById('btn-cancel').href = '/view/posts/' + postId;

    async function loadPost() {
        try {
            const res = await fetch('/api/v1/posts/' + postId);
            const json = await res.json();

            if (!res.ok) {
                alert(json.error?.message || '게시글을 불러올 수 없습니다.');
                location.href = '/view';
                return;
            }

            const post = json.data;
            document.getElementById('region').textContent = post.regionName;
            document.getElementById('title').value = post.title;
            document.getElementById('content').value = post.content;
        } catch (e) {
            alert('서버와 통신할 수 없습니다.');
            location.href = '/view';
        }
    }

    loadPost();

    document.getElementById('edit-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorMsg = document.getElementById('error-msg');
        errorMsg.style.display = 'none';

        const title = document.getElementById('title').value.trim();
        const content = document.getElementById('content').value.trim();

        if (!title || !content) {
            errorMsg.textContent = '모든 필드를 입력해주세요.';
            errorMsg.style.display = 'block';
            return;
        }

        try {
            const res = await fetch('/api/v1/posts/' + postId, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ title, content })
            });

            const json = await res.json();

            if (!res.ok) {
                errorMsg.textContent = json.error?.message || '수정에 실패했습니다.';
                errorMsg.style.display = 'block';
                return;
            }

            location.href = '/view/posts/' + postId;
        } catch (err) {
            errorMsg.textContent = '서버와 통신할 수 없습니다.';
            errorMsg.style.display = 'block';
        }
    });
</script>
</body>
</html>
