<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - Travelan</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; display: flex; justify-content: center; padding: 40px 16px; }
        .container { width: 100%; max-width: 400px; }
        h1 { text-align: center; margin-bottom: 32px; color: #333; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #444; font-size: 14px; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
        input:focus { outline: none; border-color: #4a90d9; }
        .submit-btn { width: 100%; padding: 12px; background: #4a90d9; color: #fff; border: none; border-radius: 6px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; }
        .submit-btn:hover { background: #357abd; }
        .submit-btn:disabled { background: #b0c4de; cursor: not-allowed; }
        .result { margin-top: 24px; padding: 16px; border-radius: 6px; display: none; }
        .result.success { display: block; background: #d4edda; color: #155724; }
        .result.error { display: block; background: #f8d7da; color: #721c24; }
        .links { text-align: center; margin-top: 24px; font-size: 14px; }
        .links a { color: #4a90d9; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="container">
    <h1>로그인</h1>
    <form id="loginForm" onsubmit="return handleLogin(event)">
        <div class="form-group">
            <label for="email">이메일</label>
            <input type="email" id="email" name="email" placeholder="example@email.com" required>
        </div>

        <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">로그인</button>
    </form>

    <div id="result" class="result"></div>

    <div class="links">
        <a href="/view/signup">계정이 없으신가요? 회원가입</a>
    </div>
</div>

<script>
    async function handleLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const result = document.getElementById('result');
        btn.disabled = true;

        const body = {
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
        };

        try {
            const res = await fetch('/api/v1/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const json = await res.json();

            if (res.ok) {
                localStorage.setItem('accessToken', json.data.accessToken);
                result.className = 'result success';
                result.innerHTML = '<strong>로그인 성공!</strong> 메인 페이지로 이동합니다...';
                setTimeout(() => { location.href = '/view'; }, 1000);
            } else {
                result.className = 'result error';
                result.innerHTML = '<strong>로그인 실패:</strong> ' + (json.error?.message || '알 수 없는 오류');
            }
        } catch (e) {
            result.className = 'result error';
            result.innerHTML = '<strong>네트워크 오류:</strong> 서버에 연결할 수 없습니다';
        }
        btn.disabled = false;
    }
</script>
</body>
</html>
