spring:
  application:
    name: travelan
  profiles:
    active: dev
  docker:
    compose:
      file: docker-compose.yml
  datasource:
    write:
      url: jdbc:mysql://localhost:3306/travelan?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      username: travelan
      password: travelan
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        pool-name: write-pool
    read:
      url: jdbc:mysql://localhost:3306/travelan?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      username: travelan
      password: travelan
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        maximum-pool-size: 15
        pool-name: read-pool
  jpa:
    hibernate:
      ddl-auto: none
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 50MB
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  upload:
    root: ./uploads

jwt:
  secret: jwt_secret_must_be_changed_in_production_in_case_of_security_breaches
  access-token-expiry: 900       # 15분 (초)
  refresh-token-expiry: 2592000  # 30일 (초)

management:
  endpoints:
    web:
      exposure:
        include: health
