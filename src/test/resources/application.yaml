spring:
  datasource:
    url: jdbc:h2:mem:travelan;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  docker:
    compose:
      enabled: false

jwt:
  secret: test-jwt-secret-key-that-is-at-least-32-characters-long-for-testing
  access-token-expiry: 900
  refresh-token-expiry: 2592000
